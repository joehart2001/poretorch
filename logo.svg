<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#1a1a1a" />

  <!-- Inscribed spheres of increasing radius: the largest-empty-sphere idea. -->
  <g filter="url(#glow)">
    <circle cx="34" cy="60" r="7"  stroke="url(#grad1)" stroke-width="3" fill="none" />
    <circle cx="60" cy="60" r="14" stroke="url(#grad1)" stroke-width="3" fill="none" />
    <circle cx="98" cy="60" r="23" stroke="url(#grad1)" stroke-width="3" fill="none" />
  </g>
  <!-- Pore wall the spheres are inscribed against. -->
  <path d="M 18,26 Q 62,16 128,30" stroke="#555555" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 18,94 Q 62,104 128,90" stroke="#555555" stroke-width="3" fill="none" stroke-linecap="round" />

  <text x="145" y="75" font-family="Arial, sans-serif" font-weight="900" font-size="42" fill="#00ff88">Pore</text>
  <text x="238" y="75" font-family="Arial, sans-serif" font-weight="900" font-size="42" fill="#ffffff">Torch</text>
  <text x="148" y="95" font-family="Arial, sans-serif" font-size="12" fill="#888888" letter-spacing="1">GPU-ACCELERATED PORE ANALYSIS</text>
</svg>
